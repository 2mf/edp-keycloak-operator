name: Build snapshot image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build the snapshot from (branch, tag or SHA). Defaults to the latest tag.'
        required: false
        default: ''

env:
  GOLANG_VERSION: '1.27'
  IMAGE_NAME: ghcr.io/2mf/edp-keycloak-operator

jobs:
  build-snapshot:
    name: Build and push snapshot image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: '0'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true

      - name: Determine snapshot tag
        run: |
          set -xue

          # Latest reachable tag, e.g. v1.36.0 -> 1.36.0
          SOURCE_TAG="$(git describe --tags --abbrev=0)"
          VERSION="${SOURCE_TAG#v}"
          SNAPSHOT_TAG="SNAPSHOT-${VERSION}-${GITHUB_RUN_NUMBER}"

          echo "SOURCE_TAG=${SOURCE_TAG}" >> "$GITHUB_ENV"
          echo "SNAPSHOT_TAG=${SNAPSHOT_TAG}" >> "$GITHUB_ENV"

      - name: Build operator binaries
        run: |
          set -xue
          make build HOST_OS=linux HOST_ARCH=amd64 VERSION="${SNAPSHOT_TAG}"
          make build HOST_OS=linux HOST_ARCH=arm64 VERSION="${SNAPSHOT_TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push snapshot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.SNAPSHOT_TAG }}

      - name: Print image reference
        run: |
          echo "### Snapshot image published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE_NAME }}:${{ env.SNAPSHOT_TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
