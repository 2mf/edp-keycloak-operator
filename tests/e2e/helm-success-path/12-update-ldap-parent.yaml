apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmComponent
metadata:
  name: e2e-ldap-default-mappers
spec:
  realmRef:
    name: keycloakrealm-sample
    kind: KeycloakRealm
  name: e2e-ldap-default-mappers-renamed
  providerId: ldap
  providerType: org.keycloak.storage.UserStorageProvider
  removeDefaultMappers: true
  config:
    connectionUrl:
      - ldap://127.0.0.1:389
    usersDn:
      - dc=example,dc=org
    usernameLDAPAttribute:
      - uid
    rdnLDAPAttribute:
      - uid
    uuidLDAPAttribute:
      - entryUUID
    userObjectClasses:
      - inetOrgPerson
    editMode:
      - READ_ONLY
    importEnabled:
      - "true"
